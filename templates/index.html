<!DOCTYPE html>

<html lang="{{ lang }}" dir="{{ 'rtl' if lang in ['ur', 'sd'] else 'ltr' }}">

<head>
    <title>FloodSafe_Pakistan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">

    <div class="lang-switch">
        <a href="{{ url_for('home', lang='en') }}" class="{{ 'lang-active' if lang == 'en' else '' }}">English</a>
        <a href="{{ url_for('home', lang='ur') }}" class="{{ 'lang-active' if lang == 'ur' else '' }}">اردو</a>
        <a href="{{ url_for('home', lang='sd') }}" class="{{ 'lang-active' if lang == 'sd' else '' }}">سنڌي</a>
    </div>

    <h1>{{ t.app_title }}</h1>

    {% if lang == 'sd' %}
    <div class="lang-pending-note">{{ t.sindhi_pending_note }}</div>
    {% endif %}

    <br>
    <br>
    <form action="/result" method="GET">
        <input type="hidden" name="lang" value="{{ lang }}">
        <label for="city">{{ t.form_city_label }}</label>
        <input type="text" id="city" name="city" placeholder="{{ t.form_city_placeholder }}">
        <label for="rainfall">{{ t.form_rainfall_label }}</label>
        <input type="text" id="rainfall" name="rainfall" placeholder="{{ t.form_rainfall_placeholder }}">
        <button type="submit">{{ t.form_submit }}</button>
    </form>
</div>
</body>


</html>
