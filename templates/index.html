{% extends "base.html" %}

{% block title %}FloodSafe Pakistan{% endblock %}

{% block content %}
<div class="home-hero">
    <div class="home-intro">
        <h1 class="home-title">{{ t.app_title }}</h1>
        <p class="home-subtitle">{{ t.home_subtitle }}</p>
    </div>

    <div class="home-card">
        <!-- FIX (this session): the bare &#9888; renders as an oversized
             color emoji on Android Chrome. &#xFE0E; forces text
             presentation and .warn-icon sizes it to the surrounding text -
             the same fix check.html already had. -->
        <div class="disclaimer-banner">
            <span class="warn-icon">&#9888;&#xFE0E;</span> {{ t.disclaimer_banner }}
        </div>

        <!-- Primary flow: 72h forecast (city only). Swapped to primary
             per Hammad's explicit request (Sep 4) - forecast reflects
             what's actually about to happen, scenario is the
             hypothetical "what if" case and now sits below it. -->
        <form action="{{ url_for('forecast') }}" method="GET" class="home-form">
            <input type="hidden" name="lang" value="{{ lang }}">

            <label for="forecast-city">{{ t.form_city_label }}</label>
            <!-- Option value stays the canonical English city name (c) -
                 risk_check.py's normalize_city()/_CITY_TO_PROFILE/
                 _CITY_COORDS_LOOKUP all key off that string. Only the
                 displayed label is translated, via t.city_names keyed by
                 the lowercase form of c. Falls back to c itself if a city
                 is somehow missing from city_names, rather than showing
                 a blank option. -->
            <select id="forecast-city" name="city" required>
                <option value="" disabled selected>{{ t.form_city_placeholder }}</option>
                {% for c in cities %}
                <option value="{{ c }}">{{ t.city_names.get(c.lower(), c) }}</option>
                {% endfor %}
            </select>

            <button type="submit">{{ t.forecast_form_submit }}</button>
        </form>

        <!-- Secondary flow: scenario (city + hypothetical rainfall).
             Now correctly uses scenario_toggle_label / scenario_form_intro
             - these already describe a typed rainfall amount, matching
             what's actually in this form. forecast_toggle_label /
             forecast_toggle_intro are now unused (were only correct while
             this toggle wrapped the forecast form). -->
        <details class="scenario-toggle">
            <summary>{{ t.scenario_toggle_label }}</summary>
            <p>{{ t.scenario_form_intro }}</p>
            <form action="{{ url_for('result') }}" method="GET">
                <input type="hidden" name="lang" value="{{ lang }}">

                <label for="scenario-city">{{ t.form_city_label }}</label>
                <select id="scenario-city" name="city" required>
                    <option value="" disabled selected>{{ t.form_city_placeholder }}</option>
                    {% for c in cities %}
                    <option value="{{ c }}">{{ t.city_names.get(c.lower(), c) }}</option>
                    {% endfor %}
                </select>

                <label for="rainfall">{{ t.form_rainfall_label }}</label>
                <input type="number" id="rainfall" name="rainfall" min="0" step="0.1" placeholder="{{ t.form_rainfall_placeholder }}" required>
                <span class="field-hint">{{ t.form_rainfall_hint }}</span>

                <button type="submit">{{ t.form_submit }}</button>
            </form>
        </details>
    </div>
</div>
{% endblock %}
